<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindMatrix – Create Account</title>
    <meta name="description" content="Join MindMatrix and start training your brain with 40 unique memory and cognitive games across 20 progressive levels." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css" />
    <style>
        /* ── Reset ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ── Design Tokens ── */
        :root {
            --bg-deep:      #050814;
            --bg-card:      rgba(255,255,255,0.04);
            --border:       rgba(255,255,255,0.10);
            --border-focus: rgba(139,92,246,0.70);
            --accent-1:     #8b5cf6;
            --accent-2:     #06b6d4;
            --glow:         rgba(139,92,246,0.35);
            --text-pri:     #f0f4ff;
            --text-sec:     rgba(240,244,255,0.55);
            --text-muted:   rgba(240,244,255,0.30);
            --error:        #f87171;
            --success:      #34d399;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Outfit', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-pri);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ── Animated Orb Background ── */
        .bg-scene {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: var(--bg-deep);
            overflow: hidden;
        }
        .bg-scene::before,
        .bg-scene::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.20;
            animation: orb-drift 14s ease-in-out infinite alternate;
        }
        .bg-scene::before {
            width: 600px; height: 600px;
            background: radial-gradient(circle, var(--accent-1), transparent 70%);
            top: -150px; left: -150px;
        }
        .bg-scene::after {
            width: 500px; height: 500px;
            background: radial-gradient(circle, var(--accent-2), transparent 70%);
            bottom: -120px; right: -120px;
            animation-direction: alternate-reverse;
            animation-duration: 18s;
        }
        @keyframes orb-drift {
            0%   { transform: translate(0,0) scale(1); }
            50%  { transform: translate(60px,40px) scale(1.12); }
            100% { transform: translate(-40px,80px) scale(0.92); }
        }

        /* ── Grid Overlay ── */
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        /* ── Page Wrapper ── */
        .page-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* ── Logo ── */
        .logo-block {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 36px;
            text-decoration: none;
        }
        .logo-icon {
            width: 56px; height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 800; color: #fff;
            letter-spacing: -1px;
            box-shadow: 0 0 30px var(--glow);
            flex-shrink: 0;
        }
        .logo-text { display: flex; flex-direction: column; line-height: 1; }
        .logo-title {
            font-size: 26px; font-weight: 800;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .logo-tagline {
            font-size: 11px; font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        /* ── Auth Card ── */
        .auth-card {
            width: 100%; max-width: 460px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 44px 40px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04),
                0 24px 64px rgba(0,0,0,0.55),
                0 0 80px rgba(139,92,246,0.07);
            animation: card-in 0.5s cubic-bezier(0.22,1,0.36,1) both;
        }
        @keyframes card-in {
            from { opacity: 0; transform: translateY(28px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Card Header ── */
        .card-header { margin-bottom: 32px; text-align: center; }
        .card-title {
            font-size: 28px; font-weight: 700;
            color: var(--text-pri);
            margin-bottom: 8px; letter-spacing: -0.5px;
        }
        .card-subtitle { font-size: 14px; color: var(--text-sec); font-weight: 400; }

        /* ── Form ── */
        .auth-form { display: flex; flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-label {
            font-size: 13px; font-weight: 500;
            color: var(--text-sec); letter-spacing: 0.3px;
        }

        /* Input wrapper */
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon {
            position: absolute; left: 16px;
            width: 18px; height: 18px;
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.18s ease;
            flex-shrink: 0;
        }
        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 48px 14px 46px;
            font-family: 'Outfit', system-ui, sans-serif;
            font-size: 15px; font-weight: 400;
            color: var(--text-pri);
            outline: none;
            transition:
                border-color 0.18s ease,
                background 0.18s ease,
                box-shadow 0.18s ease;
        }
        .form-input::placeholder { color: var(--text-muted); }
        .form-input:focus {
            border-color: var(--border-focus);
            background: rgba(139,92,246,0.06);
            box-shadow: 0 0 0 3px rgba(139,92,246,0.15);
        }
        .input-wrapper:focus-within .input-icon { color: var(--accent-1); }

        /* Password toggle */
        .pw-toggle {
            position: absolute; right: 16px;
            background: none; border: none; cursor: pointer;
            color: var(--text-muted); padding: 0;
            display: flex; align-items: center;
            transition: color 0.18s ease;
        }
        .pw-toggle:hover { color: var(--accent-1); }
        .pw-toggle svg { width: 18px; height: 18px; }

        /* ── Strength Meter ── */
        .strength-bar-wrap {
            margin-top: 6px; height: 4px; border-radius: 4px;
            background: rgba(255,255,255,0.08); overflow: hidden;
            transition: opacity 0.2s;
        }
        .strength-bar {
            height: 100%; border-radius: 4px;
            width: 0%; transition: width 0.3s ease, background 0.3s ease;
        }
        .strength-label {
            font-size: 11px; margin-top: 4px; font-weight: 500;
            letter-spacing: 0.3px; min-height: 16px;
        }

        /* ── Alert Banner ── */
        .alert-banner {
            display: none; align-items: flex-start; gap: 10px;
            padding: 13px 16px; border-radius: 10px;
            font-size: 13.5px; font-weight: 500; line-height: 1.5;
            animation: fade-in 0.25s ease;
            margin-bottom: 4px;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .alert-banner.error {
            background: rgba(248,113,113,0.12);
            border: 1px solid rgba(248,113,113,0.30);
            color: var(--error); display: flex;
        }
        .alert-banner.success {
            background: rgba(52,211,153,0.12);
            border: 1px solid rgba(52,211,153,0.30);
            color: var(--success); display: flex;
        }

        /* ── Submit Button ── */
        .btn-primary {
            width: 100%; padding: 15px; border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: #fff;
            font-family: 'Outfit', system-ui, sans-serif;
            font-size: 15px; font-weight: 600; letter-spacing: 0.3px;
            cursor: pointer; position: relative; overflow: hidden;
            transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
            box-shadow: 0 4px 24px rgba(139,92,246,0.40);
            margin-top: 4px;
        }
        .btn-primary::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0; transition: opacity 0.18s ease;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 36px rgba(139,92,246,0.55); }
        .btn-primary:hover::before { opacity: 1; }
        .btn-primary:active { transform: translateY(0); box-shadow: 0 2px 12px rgba(139,92,246,0.35); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* Spinner */
        .btn-spinner {
            display: none; width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff; border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-primary.loading .btn-label  { display: none; }
        .btn-primary.loading .btn-spinner { display: block; }

        /* ── Divider ── */
        .divider {
            display: flex; align-items: center; gap: 12px;
            color: var(--text-muted); font-size: 12px;
            letter-spacing: 1px; text-transform: uppercase;
            margin-top: 28px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: var(--border);
        }

        /* ── Switch Link ── */
        .switch-link {
            text-align: center; font-size: 14px;
            color: var(--text-sec); margin-top: 20px;
        }
        .switch-link a {
            color: var(--accent-1); font-weight: 600;
            text-decoration: none; position: relative;
            transition: color 0.18s ease;
        }
        .switch-link a::after {
            content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            transform: scaleX(0); transform-origin: left;
            transition: transform 0.30s ease;
        }
        .switch-link a:hover { color: var(--accent-2); }
        .switch-link a:hover::after { transform: scaleX(1); }

        /* ── Terms ── */
        .terms-note {
            text-align: center; font-size: 12px;
            color: var(--text-muted); line-height: 1.6;
        }

        /* ── Validation states ── */
        .form-input.input-error {
            border-color: rgba(248,113,113,0.60) !important;
            box-shadow: 0 0 0 3px rgba(248,113,113,0.10) !important;
        }
        .form-input.input-valid { border-color: rgba(52,211,153,0.60) !important; }

        /* ── Responsive ── */
        @media (max-width: 500px) {
            .auth-card { padding: 32px 24px; border-radius: 18px; }
            .card-title { font-size: 24px; }
        }
    </style>
</head>
<body>

    <!-- ── Animated Background ── -->
    <div class="bg-scene"></div>
    <div class="bg-grid"></div>

    <!-- ── Main Content ── -->
    <main class="page-wrapper">

        <!-- Logo -->
        <a href="register.html" class="logo-block" aria-label="MindMatrix Home">
            <div class="logo-icon" aria-hidden="true">M²</div>
            <div class="logo-text">
                <span class="logo-title">MindMatrix</span>
                <span class="logo-tagline">Train Your Brain</span>
            </div>
        </a>

        <!-- Registration Card -->
        <div class="auth-card" role="main">

            <header class="card-header">
                <h1 class="card-title">Create Account</h1>
                <p class="card-subtitle">Start your memory training journey today</p>
            </header>

            <!-- Alert Banner -->
            <div id="alert-banner" class="alert-banner" role="alert" aria-live="polite"></div>

            <!-- Registration Form -->
            <form id="register-form" class="auth-form" method="POST" action="register" novalidate>

                <!-- Username -->
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input
                            id="username" name="username" type="text"
                            class="form-input"
                            placeholder="Choose a username"
                            autocomplete="username"
                            maxlength="50" required aria-required="true"
                        />
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                        <input
                            id="email" name="email" type="email"
                            class="form-input"
                            placeholder="your@email.com"
                            autocomplete="email"
                            required aria-required="true"
                        />
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input
                            id="password" name="password" type="password"
                            class="form-input"
                            placeholder="Min. 6 characters"
                            autocomplete="new-password"
                            required aria-required="true"
                        />
                        <button type="button" id="pw-toggle" class="pw-toggle" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <div class="strength-bar-wrap" id="strength-wrap" style="display:none">
                        <div class="strength-bar" id="strength-bar"></div>
                    </div>
                    <div class="strength-label" id="strength-label"></div>
                </div>

                <!-- Submit -->
                <button type="submit" id="register-btn" class="btn-primary">
                    <span class="btn-label">Create My Account</span>
                    <span class="btn-spinner" aria-hidden="true"></span>
                </button>

                <p class="terms-note">
                    By registering, you agree to train hard and challenge your memory. 🧠
                </p>

            </form>

            <div class="divider">or</div>

            <p class="switch-link">
                Already have an account?
                <a href="login.html" id="signin-link">Sign In</a>
            </p>

        </div><!-- /.auth-card -->

    </main>

    <script>
        /* ── Helpers used by main.js ── */
        function showAlert(msg, type) {
            const b = document.getElementById('alert-banner');
            b.textContent = msg;
            b.className = 'alert-banner ' + type;
        }
        function hideAlert() {
            const b = document.getElementById('alert-banner');
            b.className = 'alert-banner';
        }
        function setButtonLoading(btn, on) {
            btn.disabled = on;
            btn.classList.toggle('loading', on);
        }

        /* ── Password visibility toggle with Slash Icon ── */
        const slashIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
        const openIcon  = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        const regToggleBtn = document.getElementById('pw-toggle');
        regToggleBtn.addEventListener('click', function () {
            const inp = document.getElementById('password');
            const isPassword = inp.type === 'password';
            inp.type = isPassword ? 'text' : 'password';
            regToggleBtn.innerHTML = inp.type === 'password' ? slashIcon : openIcon;
        });

        /* ── Password strength meter ── */
        const pwInput     = document.getElementById('password');
        const strengthBar = document.getElementById('strength-bar');
        const strengthWrap= document.getElementById('strength-wrap');
        const strengthLbl = document.getElementById('strength-label');

        pwInput.addEventListener('input', () => {
            const val = pwInput.value;
            strengthWrap.style.display = val.length ? 'block' : 'none';
            let score = 0;
            if (val.length >= 6)  score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;
            const levels = [
                { pct: '20%',  bg: '#ef4444', label: 'Very Weak',   color: '#ef4444' },
                { pct: '40%',  bg: '#f97316', label: 'Weak',        color: '#f97316' },
                { pct: '60%',  bg: '#eab308', label: 'Fair',        color: '#eab308' },
                { pct: '80%',  bg: '#22c55e', label: 'Strong',      color: '#22c55e' },
                { pct: '100%', bg: '#06b6d4', label: 'Very Strong', color: '#06b6d4' },
            ];
            const lvl = levels[Math.min(score, 4)];
            strengthBar.style.width      = lvl.pct;
            strengthBar.style.background = lvl.bg;
            strengthLbl.textContent      = lvl.label;
            strengthLbl.style.color      = lvl.color;
        });

        /* ── Client-side form validation ── */
        const form = document.getElementById('register-form');
        const btn  = document.getElementById('register-btn');

        form.addEventListener('submit', (e) => {
            const username = document.getElementById('username').value.trim();
            const email    = document.getElementById('email').value.trim();
            const password = pwInput.value.trim();
            hideAlert();
            if (!username || !email || !password) {
                e.preventDefault();
                showAlert('Please fill in all fields.', 'error');
                return;
            }
            if (username.length < 3) {
                e.preventDefault();
                showAlert('Username must be at least 3 characters.', 'error');
                return;
            }
            if (!/^[\w.+-]+@[\w-]+\.[\w.]+$/.test(email)) {
                e.preventDefault();
                showAlert('Please enter a valid email address.', 'error');
                return;
            }
            if (password.length < 6) {
                e.preventDefault();
                showAlert('Password must be at least 6 characters.', 'error');
                return;
            }
            setButtonLoading(btn, true);
        });

        /* ── Show server-side error from URL param ── */
        const params = new URLSearchParams(window.location.search);
        const err = params.get('error');
        if (err) showAlert(decodeURIComponent(err), 'error');
    </script>

</body>
</html>
