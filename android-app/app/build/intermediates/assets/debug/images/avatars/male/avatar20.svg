<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad20" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <!-- Skin Shading -->
    <linearGradient id="skinGrad20" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <!-- Hair Gradient -->
    <linearGradient id="hairGrad20" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <!-- Filter Glow -->
    <filter id="softGlow20" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Clip / Base -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad20)"/>
  <!-- Ambient Orbit Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Back Hair (if any) -->
  

  <!-- Body / Torso / Neck -->
  <!-- Neck -->
  <path d="M86,120 L114,120 L118,150 L82,150 Z" fill="#fed7aa" opacity="0.95"/>
  <path d="M88,126 C96,134 104,134 112,126 L112,136 C104,142 96,142 88,136 Z" fill="rgba(0,0,0,0.12)"/>

  <!-- Clothing / Shoulders -->
  <g class="clothing">
    <path d="M42,148 C48,124 76,120 100,120 C124,120 152,124 158,148 L174,200 L26,200 Z" fill="#09090b"/>
                        <path d="M80,120 L100,154 L120,120 Z" fill="#18181b"/>
                        <path d="M52,156 L78,136" fill="none" stroke="#06b6d4" stroke-width="2"/>
                        <path d="M148,156 L122,136" fill="none" stroke="#06b6d4" stroke-width="2"/>
                        <polygon points="100,156 94,166 106,166" fill="#8b5cf6"/>
  </g>

  <!-- Head / Face Base -->
  <g class="face">
    <!-- Head Base Shape -->
    <path d="M62,80 C62,48 138,48 138,80 C138,114 122,136 100,136 C78,136 62,114 62,80 Z" fill="url(#skinGrad20)"/>
    
    <!-- Ears -->
    <ellipse cx="61" cy="88" rx="6.5" ry="10" fill="#fef08a"/>
    <ellipse cx="61" cy="88" rx="3.5" ry="6" fill="#fed7aa"/>
    <ellipse cx="139" cy="88" rx="6.5" ry="10" fill="#fef08a"/>
    <ellipse cx="139" cy="88" rx="3.5" ry="6" fill="#fed7aa"/>

    <!-- Cheeks Blush -->
    <ellipse cx="76" cy="98" rx="9" ry="5" fill="#f87171" opacity="0.35"/>
    <ellipse cx="124" cy="98" rx="9" ry="5" fill="#f87171" opacity="0.35"/>

    <!-- Eyebrows -->
    <path d="M72,69 Q82,65 92,69" fill="none" stroke="#a1a1aa" stroke-width="3" stroke-linecap="round"/>
    <path d="M108,69 Q118,65 128,69" fill="none" stroke="#a1a1aa" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes (Left & Right) -->
    <!-- Left Eye -->
    <ellipse cx="82" cy="78" rx="7" ry="6.5" fill="#ffffff"/>
    <circle cx="82.5" cy="78" r="4.5" fill="#06b6d4"/>
    <circle cx="82.5" cy="78" r="2.2" fill="#111827"/>
    <circle cx="80.5" cy="76" r="1.5" fill="#ffffff"/>
    <path d="M74,75 Q82,71 90,75" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Eye -->
    <ellipse cx="118" cy="78" rx="7" ry="6.5" fill="#ffffff"/>
    <circle cx="117.5" cy="78" r="4.5" fill="#06b6d4"/>
    <circle cx="117.5" cy="78" r="2.2" fill="#111827"/>
    <circle cx="115.5" cy="76" r="1.5" fill="#ffffff"/>
    <path d="M110,75 Q118,71 126,75" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M98,84 Q100,94 95,95 Q100,96 105,95" fill="none" stroke="#fed7aa" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Mouth / Smile -->
    <path d="M89,106 Q100,116 111,106" fill="none" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
    <path d="M93,107 Q100,113 107,107" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Front Hair -->
  <g class="hair">
    <polygon points="62,56 68,34 78,48" fill="url(#hairGrad20)"/>
                    <polygon points="78,46 88,26 98,42" fill="url(#hairGrad20)"/>
                    <polygon points="98,42 108,22 116,40" fill="url(#hairGrad20)"/>
                    <polygon points="116,40 126,28 134,48" fill="url(#hairGrad20)"/>
                    <path d="M58,72 C58,40 142,40 142,72 C132,56 118,48 100,48 C82,48 68,56 58,72 Z" fill="url(#hairGrad20)"/>
                    <path d="M66,54 C82,40 118,40 134,54" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- Accessories & Highlights -->
  <rect x="58" y="92" width="2" height="6" rx="1" fill="#06b6d4"/>
  

  <!-- Outer Glass Border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
</svg>