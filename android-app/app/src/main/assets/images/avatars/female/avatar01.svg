<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    <!-- Skin Shading -->
    <linearGradient id="skinGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <!-- Hair Gradient -->
    <linearGradient id="hairGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Filter Glow -->
    <filter id="softGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Clip / Base -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad1)"/>
  <!-- Ambient Orbit Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Back Hair (if any) -->
  <path d="M48,70 C40,110 50,165 72,175 C64,135 68,90 62,70 Z" fill="#78350f"/>
                        <path d="M152,70 C160,110 150,165 128,175 C136,135 132,90 138,70 Z" fill="#78350f"/>

  <!-- Body / Torso / Neck -->
  <!-- Neck -->
  <path d="M86,120 L114,120 L118,150 L82,150 Z" fill="#fdba74" opacity="0.95"/>
  <path d="M88,126 C96,134 104,134 112,126 L112,136 C104,142 96,142 88,136 Z" fill="rgba(0,0,0,0.12)"/>

  <!-- Clothing / Shoulders -->
  <g class="clothing">
    <path d="M50,150 C50,130 75,125 100,125 C125,125 150,130 150,150 L168,200 L32,200 Z" fill="#8b5cf6"/>
                        <path d="M84,125 L100,155 L116,125 Z" fill="#f8fafc"/>
                        <path d="M50,150 L84,125 L88,200 L40,200 Z" fill="#7c3aed"/>
                        <path d="M150,150 L116,125 L112,200 L160,200 Z" fill="#7c3aed"/>
                        <circle cx="100" cy="144" r="3.5" fill="#f59e0b"/>
  </g>

  <!-- Head / Face Base -->
  <g class="face">
    <!-- Head Base Shape -->
    <path d="M62,80 C62,48 138,48 138,80 C138,114 122,136 100,136 C78,136 62,114 62,80 Z" fill="url(#skinGrad1)"/>
    
    <!-- Ears -->
    <ellipse cx="61" cy="88" rx="6.5" ry="10" fill="#ffedd5"/>
    <ellipse cx="61" cy="88" rx="3.5" ry="6" fill="#fdba74"/>
    <ellipse cx="139" cy="88" rx="6.5" ry="10" fill="#ffedd5"/>
    <ellipse cx="139" cy="88" rx="3.5" ry="6" fill="#fdba74"/>

    <!-- Cheeks Blush -->
    <ellipse cx="76" cy="98" rx="9" ry="5" fill="#f43f5e" opacity="0.35"/>
    <ellipse cx="124" cy="98" rx="9" ry="5" fill="#f43f5e" opacity="0.35"/>

    <!-- Eyebrows -->
    <path d="M72,69 Q82,65 92,69" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
    <path d="M108,69 Q118,65 128,69" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes (Left & Right) -->
    <!-- Left Eye -->
    <ellipse cx="82" cy="78" rx="7" ry="6.5" fill="#ffffff"/>
    <circle cx="82.5" cy="78" r="4.5" fill="#0284c7"/>
    <circle cx="82.5" cy="78" r="2.2" fill="#111827"/>
    <circle cx="80.5" cy="76" r="1.5" fill="#ffffff"/>
    <path d="M74,75 Q82,71 90,75" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Eye -->
    <ellipse cx="118" cy="78" rx="7" ry="6.5" fill="#ffffff"/>
    <circle cx="117.5" cy="78" r="4.5" fill="#0284c7"/>
    <circle cx="117.5" cy="78" r="2.2" fill="#111827"/>
    <circle cx="115.5" cy="76" r="1.5" fill="#ffffff"/>
    <path d="M110,75 Q118,71 126,75" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M98,84 Q100,94 95,95 Q100,96 105,95" fill="none" stroke="#fdba74" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Mouth / Smile -->
    <path d="M89,106 Q100,116 111,106" fill="none" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/>
    <path d="M93,107 Q100,113 107,107" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Front Hair -->
  <g class="hair">
    <path d="M56,70 C56,36 144,36 144,70 C144,78 138,72 132,60 C120,44 80,44 68,60 C62,72 56,78 56,70 Z" fill="url(#hairGrad1)"/>
                    <path d="M60,65 C72,50 100,52 110,65 C95,58 75,60 60,65 Z" fill="#fde047" opacity="0.6"/>
                    <path d="M58,72 C50,95 52,130 68,148 C62,125 64,95 68,78 Z" fill="url(#hairGrad1)"/>
                    <path d="M142,72 C150,95 148,130 132,148 C138,125 136,95 132,78 Z" fill="url(#hairGrad1)"/>
  </g>

  <!-- Accessories & Highlights -->
  <circle cx="58" cy="94" r="3" fill="#fbbf24"/>
                      <circle cx="142" cy="94" r="3" fill="#fbbf24"/>
  

  <!-- Outer Glass Border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
</svg>