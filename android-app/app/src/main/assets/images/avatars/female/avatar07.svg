<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad7" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    <!-- Skin Shading -->
    <linearGradient id="skinGrad7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Hair Gradient -->
    <linearGradient id="hairGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <!-- Filter Glow -->
    <filter id="softGlow7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Clip / Base -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad7)"/>
  <!-- Ambient Orbit Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Back Hair (if any) -->
  <path d="M52,70 L48,180 L56,180 L58,80 Z" fill="#1c1917"/>
                         <path d="M62,70 L58,180 L66,180 L68,80 Z" fill="#292524"/>
                         <path d="M148,70 L152,180 L144,180 L142,80 Z" fill="#1c1917"/>
                         <path d="M138,70 L142,180 L134,180 L132,80 Z" fill="#292524"/>

  <!-- Body / Torso / Neck -->
  <!-- Neck -->
  <path d="M86,120 L114,120 L118,150 L82,150 Z" fill="#78350f" opacity="0.95"/>
  <path d="M88,126 C96,134 104,134 112,126 L112,136 C104,142 96,142 88,136 Z" fill="rgba(0,0,0,0.12)"/>

  <!-- Clothing / Shoulders -->
  <g class="clothing">
    <path d="M46,148 C50,126 80,124 100,124 C120,124 150,126 154,148 L170,200 L30,200 Z" fill="#047857"/>
                        <path d="M78,124 L100,154 L122,124 Z" fill="#f8fafc"/>
                        <path d="M46,148 L78,124 L82,200 L38,200 Z" fill="#065f46"/>
                        <path d="M154,148 L122,124 L118,200 L162,200 Z" fill="#065f46"/>
  </g>

  <!-- Head / Face Base -->
  <g class="face">
    <!-- Head Base Shape -->
    <path d="M62,80 C62,48 138,48 138,80 C138,114 122,136 100,136 C78,136 62,114 62,80 Z" fill="url(#skinGrad7)"/>
    
    <!-- Ears -->
    <ellipse cx="61" cy="88" rx="6.5" ry="10" fill="#d97706"/>
    <ellipse cx="61" cy="88" rx="3.5" ry="6" fill="#78350f"/>
    <ellipse cx="139" cy="88" rx="6.5" ry="10" fill="#d97706"/>
    <ellipse cx="139" cy="88" rx="3.5" ry="6" fill="#78350f"/>

    <!-- Cheeks Blush -->
    <ellipse cx="76" cy="98" rx="9" ry="5" fill="#be123c" opacity="0.35"/>
    <ellipse cx="124" cy="98" rx="9" ry="5" fill="#be123c" opacity="0.35"/>

    <!-- Eyebrows -->
    <path d="M72,69 Q82,65 92,69" fill="none" stroke="#0c0a09" stroke-width="3" stroke-linecap="round"/>
    <path d="M108,69 Q118,65 128,69" fill="none" stroke="#0c0a09" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes (Left & Right) -->
    <!-- Left Eye -->
    <ellipse cx="82" cy="78" rx="7" ry="6.5" fill="#ffffff"/>
    <circle cx="82.5" cy="78" r="4.5" fill="#d97706"/>
    <circle cx="82.5" cy="78" r="2.2" fill="#111827"/>
    <circle cx="80.5" cy="76" r="1.5" fill="#ffffff"/>
    <path d="M74,75 Q82,71 90,75" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Eye -->
    <ellipse cx="118" cy="78" rx="7" ry="6.5" fill="#ffffff"/>
    <circle cx="117.5" cy="78" r="4.5" fill="#d97706"/>
    <circle cx="117.5" cy="78" r="2.2" fill="#111827"/>
    <circle cx="115.5" cy="76" r="1.5" fill="#ffffff"/>
    <path d="M110,75 Q118,71 126,75" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M98,84 Q100,94 95,95 Q100,96 105,95" fill="none" stroke="#78350f" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Mouth / Smile -->
    <path d="M89,106 Q100,116 111,106" fill="none" stroke="#9f1239" stroke-width="3" stroke-linecap="round"/>
    <path d="M93,107 Q100,113 107,107" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Front Hair -->
  <g class="hair">
    <path d="M56,72 C56,36 144,36 144,72 C144,78 136,54 120,50 C100,46 80,46 68,54 C60,62 56,78 56,72 Z" fill="url(#hairGrad7)"/>
                    <line x1="72" y1="52" x2="80" y2="70" stroke="#f59e0b" stroke-width="1.5"/>
                    <line x1="128" y1="52" x2="120" y2="70" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <!-- Accessories & Highlights -->
  <circle cx="58" cy="94" r="5.5" fill="none" stroke="#fbbf24" stroke-width="2"/>
                      <circle cx="142" cy="94" r="5.5" fill="none" stroke="#fbbf24" stroke-width="2"/>
  

  <!-- Outer Glass Border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
</svg>