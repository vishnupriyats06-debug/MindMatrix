<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad4" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
    <!-- Skin Shading -->
    <linearGradient id="skinGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <!-- Hair Gradient -->
    <linearGradient id="hairGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <!-- Filter Glow -->
    <filter id="softGlow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Clip / Base -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad4)"/>
  <!-- Ambient Orbit Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Back Hair (if any) -->
  <circle cx="56" cy="65" r="18" fill="#1c1917"/>
                         <circle cx="144" cy="65" r="18" fill="#1c1917"/>
                         <circle cx="52" cy="90" r="16" fill="#1c1917"/>
                         <circle cx="148" cy="90" r="16" fill="#1c1917"/>
                         <circle cx="56" cy="115" r="16" fill="#1c1917"/>
                         <circle cx="144" cy="115" r="16" fill="#1c1917"/>
                         <circle cx="68" cy="45" r="18" fill="#1c1917"/>
                         <circle cx="132" cy="45" r="18" fill="#1c1917"/>
                         <circle cx="100" cy="38" r="20" fill="#1c1917"/>

  <!-- Body / Torso / Neck -->
  <!-- Neck -->
  <path d="M86,120 L114,120 L118,150 L82,150 Z" fill="#b45309" opacity="0.95"/>
  <path d="M88,126 C96,134 104,134 112,126 L112,136 C104,142 96,142 88,136 Z" fill="rgba(0,0,0,0.12)"/>

  <!-- Clothing / Shoulders -->
  <g class="clothing">
    <path d="M46,146 C50,126 80,124 100,124 C120,124 150,126 154,146 L170,200 L30,200 Z" fill="#ea580c"/>
                        <path d="M80,124 C86,148 114,148 120,124 Z" fill="#facc15"/>
                        <circle cx="100" cy="148" r="4" fill="#f43f5e"/>
  </g>

  <!-- Head / Face Base -->
  <g class="face">
    <!-- Head Base Shape -->
    <path d="M62,80 C62,48 138,48 138,80 C138,114 122,136 100,136 C78,136 62,114 62,80 Z" fill="url(#skinGrad4)"/>
    
    <!-- Ears -->
    <ellipse cx="61" cy="88" rx="6.5" ry="10" fill="#fcd34d"/>
    <ellipse cx="61" cy="88" rx="3.5" ry="6" fill="#b45309"/>
    <ellipse cx="139" cy="88" rx="6.5" ry="10" fill="#fcd34d"/>
    <ellipse cx="139" cy="88" rx="3.5" ry="6" fill="#b45309"/>

    <!-- Cheeks Blush -->
    <ellipse cx="76" cy="98" rx="9" ry="5" fill="#e11d48" opacity="0.35"/>
    <ellipse cx="124" cy="98" rx="9" ry="5" fill="#e11d48" opacity="0.35"/>

    <!-- Eyebrows -->
    <path d="M72,69 Q82,65 92,69" fill="none" stroke="#0c0a09" stroke-width="3" stroke-linecap="round"/>
    <path d="M108,69 Q118,65 128,69" fill="none" stroke="#0c0a09" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes (Left & Right) -->
    <!-- Left Eye -->
    <ellipse cx="82" cy="78" rx="7" ry="6.5" fill="#ffffff"/>
    <circle cx="82.5" cy="78" r="4.5" fill="#78350f"/>
    <circle cx="82.5" cy="78" r="2.2" fill="#111827"/>
    <circle cx="80.5" cy="76" r="1.5" fill="#ffffff"/>
    <path d="M74,75 Q82,71 90,75" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Eye -->
    <ellipse cx="118" cy="78" rx="7" ry="6.5" fill="#ffffff"/>
    <circle cx="117.5" cy="78" r="4.5" fill="#78350f"/>
    <circle cx="117.5" cy="78" r="2.2" fill="#111827"/>
    <circle cx="115.5" cy="76" r="1.5" fill="#ffffff"/>
    <path d="M110,75 Q118,71 126,75" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M98,84 Q100,94 95,95 Q100,96 105,95" fill="none" stroke="#b45309" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Mouth / Smile -->
    <path d="M89,106 Q100,116 111,106" fill="none" stroke="#be123c" stroke-width="3" stroke-linecap="round"/>
    <path d="M93,107 Q100,113 107,107" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Front Hair -->
  <g class="hair">
    <circle cx="70" cy="60" r="14" fill="url(#hairGrad4)"/>
                    <circle cx="130" cy="60" r="14" fill="url(#hairGrad4)"/>
                    <circle cx="100" cy="52" r="16" fill="url(#hairGrad4)"/>
                    <circle cx="82" cy="54" r="14" fill="url(#hairGrad4)"/>
                    <circle cx="118" cy="54" r="14" fill="url(#hairGrad4)"/>
  </g>

  <!-- Accessories & Highlights -->
  <circle cx="58" cy="95" r="6" fill="none" stroke="#facc15" stroke-width="2"/>
                      <circle cx="142" cy="95" r="6" fill="none" stroke="#facc15" stroke-width="2"/>
  

  <!-- Outer Glass Border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
</svg>