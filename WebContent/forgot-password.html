<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindMatrix – Reset Password</title>
    <meta name="description" content="Reset your MindMatrix account password to regain access to your brain training progress." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css" />
    <style>
        /* ── Reset ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-deep:      #050814;
            --bg-card:      rgba(255,255,255,0.04);
            --border:       rgba(255,255,255,0.10);
            --border-focus: rgba(139,92,246,0.70);
            --accent-1:     #8b5cf6;
            --accent-2:     #06b6d4;
            --glow:         rgba(139,92,246,0.35);
            --text-pri:     #f0f4ff;
            --text-sec:     rgba(240,244,255,0.55);
            --text-muted:   rgba(240,244,255,0.30);
            --error:        #f87171;
            --success:      #34d399;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Outfit', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-pri);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ── Animated Background ── */
        .bg-scene {
            position: fixed; inset: 0; z-index: 0;
            background: var(--bg-deep); overflow: hidden;
        }
        .bg-scene::before, .bg-scene::after {
            content: ''; position: absolute; border-radius: 50%;
            filter: blur(120px); opacity: 0.20;
            animation: orb-drift 14s ease-in-out infinite alternate;
        }
        .bg-scene::before {
            width: 600px; height: 600px;
            background: radial-gradient(circle, var(--accent-1), transparent 70%);
            top: -150px; left: -150px;
        }
        .bg-scene::after {
            width: 500px; height: 500px;
            background: radial-gradient(circle, var(--accent-2), transparent 70%);
            bottom: -120px; right: -120px;
            animation-direction: alternate-reverse; animation-duration: 18s;
        }
        @keyframes orb-drift {
            0%   { transform: translate(0,0) scale(1); }
            50%  { transform: translate(60px,40px) scale(1.12); }
            100% { transform: translate(-40px,80px) scale(0.92); }
        }

        .bg-grid {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px; pointer-events: none;
        }

        /* ── Page Wrapper ── */
        .page-wrapper {
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; padding: 40px 20px;
        }

        /* ── Logo ── */
        .logo-block {
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 36px; text-decoration: none;
        }
        .logo-icon {
            width: 56px; height: 56px; border-radius: 16px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 800; color: #fff;
            letter-spacing: -1px; box-shadow: 0 0 30px var(--glow); flex-shrink: 0;
        }
        .logo-text { display: flex; flex-direction: column; line-height: 1; }
        .logo-title {
            font-size: 26px; font-weight: 800;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; letter-spacing: -0.5px;
        }
        .logo-tagline {
            font-size: 11px; font-weight: 400; color: var(--text-muted);
            letter-spacing: 2px; text-transform: uppercase; margin-top: 3px;
        }

        /* ── Auth Card ── */
        .auth-card {
            width: 100%; max-width: 460px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px; padding: 44px 40px;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04),
                0 24px 64px rgba(0,0,0,0.55),
                0 0 80px rgba(139,92,246,0.07);
            animation: card-in 0.5s cubic-bezier(0.22,1,0.36,1) both;
        }
        @keyframes card-in {
            from { opacity: 0; transform: translateY(28px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-header { margin-bottom: 28px; text-align: center; }
        .card-icon-badge {
            width: 48px; height: 48px; border-radius: 14px;
            background: rgba(139,92,246,0.12); border: 1px solid rgba(139,92,246,0.3);
            display: inline-flex; align-items: center; justify-content: center;
            color: var(--accent-1); margin-bottom: 14px;
        }
        .card-title {
            font-size: 28px; font-weight: 700; color: var(--text-pri);
            margin-bottom: 8px; letter-spacing: -0.5px;
        }
        .card-subtitle { font-size: 14px; color: var(--text-sec); font-weight: 400; }

        /* ── Form ── */
        .auth-form { display: flex; flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-label { font-size: 13px; font-weight: 500; color: var(--text-sec); letter-spacing: 0.3px; }

        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon {
            position: absolute; left: 16px; width: 18px; height: 18px;
            color: var(--text-muted); pointer-events: none; flex-shrink: 0;
            transition: color 0.18s ease;
        }
        .form-input {
            width: 100%; background: rgba(255,255,255,0.05);
            border: 1px solid var(--border); border-radius: 12px;
            padding: 14px 48px 14px 46px;
            font-family: 'Outfit', system-ui, sans-serif;
            font-size: 15px; font-weight: 400; color: var(--text-pri); outline: none;
            transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
        }
        .form-input::placeholder { color: var(--text-muted); }
        .form-input:focus {
            border-color: var(--border-focus);
            background: rgba(139,92,246,0.06);
            box-shadow: 0 0 0 3px rgba(139,92,246,0.15);
        }
        .input-wrapper:focus-within .input-icon { color: var(--accent-1); }

        .pw-toggle {
            position: absolute; right: 16px; background: none; border: none;
            cursor: pointer; color: var(--text-muted); padding: 0;
            display: flex; align-items: center; transition: color 0.18s ease;
        }
        .pw-toggle:hover { color: var(--accent-1); }
        .pw-toggle svg { width: 18px; height: 18px; }

        /* ── Alert ── */
        .alert-banner {
            display: none; align-items: flex-start; gap: 10px;
            padding: 13px 16px; border-radius: 10px;
            font-size: 13.5px; font-weight: 500; line-height: 1.5;
            animation: fade-in 0.25s ease; margin-bottom: 4px;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .alert-banner.error {
            background: rgba(248,113,113,0.12);
            border: 1px solid rgba(248,113,113,0.30);
            color: var(--error); display: flex;
        }
        .alert-banner.success {
            background: rgba(52,211,153,0.12);
            border: 1px solid rgba(52,211,153,0.30);
            color: var(--success); display: flex;
        }

        /* ── Button ── */
        .btn-primary {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: #fff; font-family: 'Outfit', system-ui, sans-serif;
            font-size: 15px; font-weight: 600; letter-spacing: 0.3px;
            cursor: pointer; position: relative; overflow: hidden;
            transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
            box-shadow: 0 4px 24px rgba(139,92,246,0.40); margin-top: 8px;
        }
        .btn-primary::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0; transition: opacity 0.18s ease;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 36px rgba(139,92,246,0.55); }
        .btn-primary:hover::before { opacity: 1; }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .btn-spinner {
            display: none; width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
            border-radius: 50%; animation: spin 0.6s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-primary.loading .btn-label  { display: none; }
        .btn-primary.loading .btn-spinner { display: block; }

        /* ── Divider ── */
        .divider {
            display: flex; align-items: center; gap: 12px;
            color: var(--text-muted); font-size: 12px;
            letter-spacing: 1px; text-transform: uppercase; margin-top: 28px;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        /* ── Switch Link ── */
        .switch-link { text-align: center; font-size: 14px; color: var(--text-sec); margin-top: 20px; }
        .switch-link a {
            color: var(--accent-1); font-weight: 600; text-decoration: none;
            position: relative; transition: color 0.18s ease;
        }
        .switch-link a::after {
            content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
            height: 1px; background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            transform: scaleX(0); transform-origin: left; transition: transform 0.30s ease;
        }
        .switch-link a:hover { color: var(--accent-2); }
        .switch-link a:hover::after { transform: scaleX(1); }

        @media (max-width: 500px) {
            .auth-card { padding: 32px 24px; border-radius: 18px; }
            .card-title { font-size: 24px; }
        }
    </style>
</head>
<body>

    <!-- ── Animated Background ── -->
    <div class="bg-scene"></div>
    <div class="bg-grid"></div>

    <!-- ── Main Content ── -->
    <main class="page-wrapper">

        <!-- Logo -->
        <a href="login.html" class="logo-block" aria-label="MindMatrix Home">
            <div class="logo-icon" aria-hidden="true">M²</div>
            <div class="logo-text">
                <span class="logo-title">MindMatrix</span>
                <span class="logo-tagline">Train Your Brain</span>
            </div>
        </a>

        <!-- Forgot Password Card -->
        <div class="auth-card" role="main">

            <header class="card-header">
                <div class="card-icon-badge">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        <circle cx="12" cy="16" r="1"/>
                    </svg>
                </div>
                <h1 class="card-title">Reset Password</h1>
                <p class="card-subtitle">Enter your account details to set a new password</p>
            </header>

            <!-- Alert Banner -->
            <div id="alert-banner" class="alert-banner" role="alert" aria-live="polite"></div>

            <!-- Form -->
            <form id="forgot-form" class="auth-form" method="POST" action="forgot-password" novalidate>

                <!-- Identifier (Username or Email) -->
                <div class="form-group">
                    <label class="form-label" for="identifier">Username or Email</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input
                            id="identifier" name="identifier" type="text"
                            class="form-input"
                            placeholder="Enter your username or email"
                            autocomplete="username"
                            required aria-required="true"
                        />
                    </div>
                </div>

                <!-- New Password -->
                <div class="form-group">
                    <label class="form-label" for="newPassword">New Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input
                            id="newPassword" name="newPassword" type="password"
                            class="form-input"
                            placeholder="At least 6 characters"
                            autocomplete="new-password"
                            minlength="6" required aria-required="true"
                        />
                        <button type="button" id="pw-toggle-new" class="pw-toggle" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Confirm New Password -->
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm New Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                        <input
                            id="confirmPassword" name="confirmPassword" type="password"
                            class="form-input"
                            placeholder="Re-enter your new password"
                            autocomplete="new-password"
                            minlength="6" required aria-required="true"
                        />
                        <button type="button" id="pw-toggle-confirm" class="pw-toggle" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" id="forgot-btn" class="btn-primary">
                    <span class="btn-label">Reset Password</span>
                    <span class="btn-spinner" aria-hidden="true"></span>
                </button>

            </form>

            <div class="divider">or</div>

            <p class="switch-link">
                Remembered your password?
                <a href="login.html" id="login-link">Sign In</a>
            </p>

        </div><!-- /.auth-card -->

    </main>

    <script>
        function showAlert(msg, type) {
            const b = document.getElementById('alert-banner');
            b.textContent = msg;
            b.className = 'alert-banner ' + type;
        }
        function hideAlert() {
            document.getElementById('alert-banner').className = 'alert-banner';
        }
        function setButtonLoading(btn, on) {
            btn.disabled = on;
            btn.classList.toggle('loading', on);
        }

        /* Password toggles */
        document.getElementById('pw-toggle-new').addEventListener('click', function () {
            const inp = document.getElementById('newPassword');
            inp.type = inp.type === 'password' ? 'text' : 'password';
        });
        document.getElementById('pw-toggle-confirm').addEventListener('click', function () {
            const inp = document.getElementById('confirmPassword');
            inp.type = inp.type === 'password' ? 'text' : 'password';
        });

        /* Form validation */
        const form = document.getElementById('forgot-form');
        const btn  = document.getElementById('forgot-btn');
        form.addEventListener('submit', (e) => {
            const identifier      = document.getElementById('identifier').value.trim();
            const newPassword     = document.getElementById('newPassword').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();

            hideAlert();

            if (!identifier || !newPassword || !confirmPassword) {
                e.preventDefault();
                showAlert('Please fill in all fields.', 'error');
                return;
            }
            if (newPassword.length < 6) {
                e.preventDefault();
                showAlert('New password must be at least 6 characters long.', 'error');
                return;
            }
            if (newPassword !== confirmPassword) {
                e.preventDefault();
                showAlert('New password and confirm password do not match.', 'error');
                return;
            }

            setButtonLoading(btn, true);
        });

        /* Show server-side error if present in URL */
        const params = new URLSearchParams(window.location.search);
        const err = params.get('error');
        if (err) showAlert(decodeURIComponent(err), 'error');
    </script>

</body>
</html>
