<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad12" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </radialGradient>
    <!-- Skin Shading -->
    <linearGradient id="skinGrad12" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Hair Gradient -->
    <linearGradient id="hairGrad12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <!-- Filter Glow -->
    <filter id="softGlow12" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Clip / Base -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad12)"/>
  <!-- Ambient Orbit Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Back Hair (if any) -->
  

  <!-- Body / Torso / Neck -->
  <!-- Neck -->
  <path d="M86,120 L114,120 L118,150 L82,150 Z" fill="#78350f" opacity="0.95"/>
  <path d="M88,126 C96,134 104,134 112,126 L112,136 C104,142 96,142 88,136 Z" fill="rgba(0,0,0,0.12)"/>

  <!-- Clothing / Shoulders -->
  <g class="clothing">
    <path d="M42,148 C48,124 76,122 100,122 C124,122 152,124 158,148 L174,200 L26,200 Z" fill="#7c3aed"/>
                        <path d="M76,122 C76,148 124,148 124,122 Z" fill="#6d28d9"/>
                        <circle cx="100" cy="162" r="6" fill="#a855f7"/>
  </g>

  <!-- Head / Face Base -->
  <g class="face">
    <!-- Head Base Shape -->
    <path d="M62,80 C62,48 138,48 138,80 C138,114 122,136 100,136 C78,136 62,114 62,80 Z" fill="url(#skinGrad12)"/>
    
    <!-- Ears -->
    <ellipse cx="61" cy="88" rx="6.5" ry="10" fill="#d97706"/>
    <ellipse cx="61" cy="88" rx="3.5" ry="6" fill="#78350f"/>
    <ellipse cx="139" cy="88" rx="6.5" ry="10" fill="#d97706"/>
    <ellipse cx="139" cy="88" rx="3.5" ry="6" fill="#78350f"/>

    <!-- Cheeks Blush -->
    <ellipse cx="76" cy="98" rx="9" ry="5" fill="#9f1239" opacity="0.35"/>
    <ellipse cx="124" cy="98" rx="9" ry="5" fill="#9f1239" opacity="0.35"/>

    <!-- Eyebrows -->
    <path d="M72,69 Q82,65 92,69" fill="none" stroke="#09090b" stroke-width="3" stroke-linecap="round"/>
    <path d="M108,69 Q118,65 128,69" fill="none" stroke="#09090b" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes (Left & Right) -->
    <!-- Left Eye -->
    <ellipse cx="82" cy="78" rx="7" ry="6.5" fill="#ffffff"/>
    <circle cx="82.5" cy="78" r="4.5" fill="#78350f"/>
    <circle cx="82.5" cy="78" r="2.2" fill="#111827"/>
    <circle cx="80.5" cy="76" r="1.5" fill="#ffffff"/>
    <path d="M74,75 Q82,71 90,75" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Eye -->
    <ellipse cx="118" cy="78" rx="7" ry="6.5" fill="#ffffff"/>
    <circle cx="117.5" cy="78" r="4.5" fill="#78350f"/>
    <circle cx="117.5" cy="78" r="2.2" fill="#111827"/>
    <circle cx="115.5" cy="76" r="1.5" fill="#ffffff"/>
    <path d="M110,75 Q118,71 126,75" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M98,84 Q100,94 95,95 Q100,96 105,95" fill="none" stroke="#78350f" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Mouth / Smile -->
    <path d="M89,106 Q100,116 111,106" fill="none" stroke="#9f1239" stroke-width="3" stroke-linecap="round"/>
    <path d="M93,107 Q100,113 107,107" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Front Hair -->
  <g class="hair">
    <circle cx="70" cy="52" r="10" fill="url(#hairGrad12)"/>
                    <circle cx="86" cy="44" r="11" fill="url(#hairGrad12)"/>
                    <circle cx="104" cy="42" r="12" fill="url(#hairGrad12)"/>
                    <circle cx="122" cy="46" r="11" fill="url(#hairGrad12)"/>
                    <circle cx="134" cy="54" r="10" fill="url(#hairGrad12)"/>
                    <path d="M58,74 C58,46 142,46 142,74 C134,60 120,54 100,54 C80,54 66,60 58,74 Z" fill="url(#hairGrad12)"/>
  </g>

  <!-- Accessories & Highlights -->
  <circle cx="59" cy="94" r="2.5" fill="#facc15"/>
  

  <!-- Outer Glass Border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
</svg>