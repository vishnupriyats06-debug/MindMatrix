<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#083344"/>
    </radialGradient>
    <!-- Skin Shading -->
    <linearGradient id="skinGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <!-- Hair Gradient -->
    <linearGradient id="hairGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <!-- Filter Glow -->
    <filter id="softGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Clip / Base -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad2)"/>
  <!-- Ambient Orbit Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Back Hair (if any) -->
  

  <!-- Body / Torso / Neck -->
  <!-- Neck -->
  <path d="M86,120 L114,120 L118,150 L82,150 Z" fill="#fde68a" opacity="0.95"/>
  <path d="M88,126 C96,134 104,134 112,126 L112,136 C104,142 96,142 88,136 Z" fill="rgba(0,0,0,0.12)"/>

  <!-- Clothing / Shoulders -->
  <g class="clothing">
    <path d="M46,148 C50,126 80,122 100,122 C120,122 150,126 154,148 L170,200 L30,200 Z" fill="#0891b2"/>
                        <path d="M82,122 L100,146 L118,122 Z" fill="#155e75"/>
                        <path d="M85,124 L100,142 L115,124" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
                        <polygon points="100,150 94,162 106,162" fill="#38bdf8"/>
  </g>

  <!-- Head / Face Base -->
  <g class="face">
    <!-- Head Base Shape -->
    <path d="M62,80 C62,48 138,48 138,80 C138,114 122,136 100,136 C78,136 62,114 62,80 Z" fill="url(#skinGrad2)"/>
    
    <!-- Ears -->
    <ellipse cx="61" cy="88" rx="6.5" ry="10" fill="#fef3c7"/>
    <ellipse cx="61" cy="88" rx="3.5" ry="6" fill="#fde68a"/>
    <ellipse cx="139" cy="88" rx="6.5" ry="10" fill="#fef3c7"/>
    <ellipse cx="139" cy="88" rx="3.5" ry="6" fill="#fde68a"/>

    <!-- Cheeks Blush -->
    <ellipse cx="76" cy="98" rx="9" ry="5" fill="#fb7185" opacity="0.35"/>
    <ellipse cx="124" cy="98" rx="9" ry="5" fill="#fb7185" opacity="0.35"/>

    <!-- Eyebrows -->
    <path d="M72,69 Q82,65 92,69" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <path d="M108,69 Q118,65 128,69" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes (Left & Right) -->
    <!-- Left Eye -->
    <ellipse cx="82" cy="78" rx="7" ry="6.5" fill="#ffffff"/>
    <circle cx="82.5" cy="78" r="4.5" fill="#059669"/>
    <circle cx="82.5" cy="78" r="2.2" fill="#111827"/>
    <circle cx="80.5" cy="76" r="1.5" fill="#ffffff"/>
    <path d="M74,75 Q82,71 90,75" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Eye -->
    <ellipse cx="118" cy="78" rx="7" ry="6.5" fill="#ffffff"/>
    <circle cx="117.5" cy="78" r="4.5" fill="#059669"/>
    <circle cx="117.5" cy="78" r="2.2" fill="#111827"/>
    <circle cx="115.5" cy="76" r="1.5" fill="#ffffff"/>
    <path d="M110,75 Q118,71 126,75" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M98,84 Q100,94 95,95 Q100,96 105,95" fill="none" stroke="#fde68a" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Mouth / Smile -->
    <path d="M89,106 Q100,116 111,106" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <path d="M93,107 Q100,113 107,107" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Front Hair -->
  <g class="hair">
    <path d="M54,74 C54,34 146,34 146,74 C146,108 140,118 132,118 C128,118 130,95 128,75 C118,52 82,52 72,75 C70,95 72,118 68,118 C60,118 54,108 54,74 Z" fill="url(#hairGrad2)"/>
                    <path d="M64,68 C78,48 122,48 136,68" fill="none" stroke="#9ca3af" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Accessories & Highlights -->
  <rect x="56" y="90" width="3" height="8" rx="1.5" fill="#22d3ee"/>
                      <rect x="141" y="90" width="3" height="8" rx="1.5" fill="#22d3ee"/>
  

  <!-- Outer Glass Border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
</svg>