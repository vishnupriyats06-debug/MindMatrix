<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad8" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    <!-- Skin Shading -->
    <linearGradient id="skinGrad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <!-- Hair Gradient -->
    <linearGradient id="hairGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#3b1d09"/>
    </linearGradient>
    <!-- Filter Glow -->
    <filter id="softGlow8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Clip / Base -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad8)"/>
  <!-- Ambient Orbit Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Back Hair (if any) -->
  <ellipse cx="100" cy="30" rx="16" ry="14" fill="#3b1d09"/>
                         <rect x="94" y="38" width="12" height="6" rx="2" fill="#ec4899"/>

  <!-- Body / Torso / Neck -->
  <!-- Neck -->
  <path d="M86,120 L114,120 L118,150 L82,150 Z" fill="#fde047" opacity="0.95"/>
  <path d="M88,126 C96,134 104,134 112,126 L112,136 C104,142 96,142 88,136 Z" fill="rgba(0,0,0,0.12)"/>

  <!-- Clothing / Shoulders -->
  <g class="clothing">
    <path d="M44,148 C48,126 78,124 100,124 C122,124 152,126 156,148 L172,200 L28,200 Z" fill="#18181b"/>
                        <path d="M84,124 L100,150 L116,124 Z" fill="#e11d48"/>
                        <path d="M44,148 L84,124 L92,200 L34,200 Z" fill="#27272a"/>
                        <path d="M156,148 L116,124 L108,200 L166,200 Z" fill="#27272a"/>
                        <rect x="88" y="128" width="24" height="4" rx="2" fill="#18181b"/>
  </g>

  <!-- Head / Face Base -->
  <g class="face">
    <!-- Head Base Shape -->
    <path d="M62,80 C62,48 138,48 138,80 C138,114 122,136 100,136 C78,136 62,114 62,80 Z" fill="url(#skinGrad8)"/>
    
    <!-- Ears -->
    <ellipse cx="61" cy="88" rx="6.5" ry="10" fill="#fef08a"/>
    <ellipse cx="61" cy="88" rx="3.5" ry="6" fill="#fde047"/>
    <ellipse cx="139" cy="88" rx="6.5" ry="10" fill="#fef08a"/>
    <ellipse cx="139" cy="88" rx="3.5" ry="6" fill="#fde047"/>

    <!-- Cheeks Blush -->
    <ellipse cx="76" cy="98" rx="9" ry="5" fill="#f43f5e" opacity="0.35"/>
    <ellipse cx="124" cy="98" rx="9" ry="5" fill="#f43f5e" opacity="0.35"/>

    <!-- Eyebrows -->
    <path d="M72,69 Q82,65 92,69" fill="none" stroke="#3b1d09" stroke-width="3" stroke-linecap="round"/>
    <path d="M108,69 Q118,65 128,69" fill="none" stroke="#3b1d09" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes (Left & Right) -->
    <!-- Left Eye -->
    <ellipse cx="82" cy="78" rx="7" ry="6.5" fill="#ffffff"/>
    <circle cx="82.5" cy="78" r="4.5" fill="#06b6d4"/>
    <circle cx="82.5" cy="78" r="2.2" fill="#111827"/>
    <circle cx="80.5" cy="76" r="1.5" fill="#ffffff"/>
    <path d="M74,75 Q82,71 90,75" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Eye -->
    <ellipse cx="118" cy="78" rx="7" ry="6.5" fill="#ffffff"/>
    <circle cx="117.5" cy="78" r="4.5" fill="#06b6d4"/>
    <circle cx="117.5" cy="78" r="2.2" fill="#111827"/>
    <circle cx="115.5" cy="76" r="1.5" fill="#ffffff"/>
    <path d="M110,75 Q118,71 126,75" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M98,84 Q100,94 95,95 Q100,96 105,95" fill="none" stroke="#fde047" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Mouth / Smile -->
    <path d="M89,106 Q100,116 111,106" fill="none" stroke="#881337" stroke-width="3" stroke-linecap="round"/>
    <path d="M93,107 Q100,113 107,107" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Front Hair -->
  <g class="hair">
    <path d="M58,74 C58,38 142,38 142,74 C142,78 134,60 120,52 C100,44 80,48 68,58 C60,68 58,78 58,74 Z" fill="url(#hairGrad8)"/>
                    <path d="M60,70 Q54,100 62,110" fill="none" stroke="#713f12" stroke-width="4" stroke-linecap="round"/>
                    <path d="M140,70 Q146,100 138,110" fill="none" stroke="#713f12" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Accessories & Highlights -->
  <rect x="88" y="126" width="24" height="3" rx="1.5" fill="#18181b"/>
                      <polygon points="100,129 97,133 103,133" fill="#f43f5e"/>
  

  <!-- Outer Glass Border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
</svg>