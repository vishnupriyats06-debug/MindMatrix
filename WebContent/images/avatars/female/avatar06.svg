<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad6" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>
    <!-- Skin Shading -->
    <linearGradient id="skinGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <!-- Hair Gradient -->
    <linearGradient id="hairGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <!-- Filter Glow -->
    <filter id="softGlow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Clip / Base -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad6)"/>
  <!-- Ambient Orbit Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Back Hair (if any) -->
  <path d="M52,70 C44,100 48,150 70,165 C62,130 64,90 60,70 Z" fill="#be185d"/>
                         <path d="M148,70 C156,100 152,150 130,165 C138,130 136,90 140,70 Z" fill="#be185d"/>

  <!-- Body / Torso / Neck -->
  <!-- Neck -->
  <path d="M86,120 L114,120 L118,150 L82,150 Z" fill="#fca5a5" opacity="0.95"/>
  <path d="M88,126 C96,134 104,134 112,126 L112,136 C104,142 96,142 88,136 Z" fill="rgba(0,0,0,0.12)"/>

  <!-- Clothing / Shoulders -->
  <g class="clothing">
    <path d="M44,146 C48,124 78,122 100,122 C122,122 152,124 156,146 L172,200 L28,200 Z" fill="#18181b"/>
                        <path d="M76,122 C76,150 124,150 124,122 Z" fill="#27272a"/>
                        <path d="M88,145 L88,175" fill="none" stroke="#f472b6" stroke-width="2"/>
                        <path d="M112,145 L112,175" fill="none" stroke="#f472b6" stroke-width="2"/>
                        <circle cx="100" cy="165" r="5" fill="#06b6d4"/>
  </g>

  <!-- Head / Face Base -->
  <g class="face">
    <!-- Head Base Shape -->
    <path d="M62,80 C62,48 138,48 138,80 C138,114 122,136 100,136 C78,136 62,114 62,80 Z" fill="url(#skinGrad6)"/>
    
    <!-- Ears -->
    <ellipse cx="61" cy="88" rx="6.5" ry="10" fill="#fed7aa"/>
    <ellipse cx="61" cy="88" rx="3.5" ry="6" fill="#fca5a5"/>
    <ellipse cx="139" cy="88" rx="6.5" ry="10" fill="#fed7aa"/>
    <ellipse cx="139" cy="88" rx="3.5" ry="6" fill="#fca5a5"/>

    <!-- Cheeks Blush -->
    <ellipse cx="76" cy="98" rx="9" ry="5" fill="#f43f5e" opacity="0.35"/>
    <ellipse cx="124" cy="98" rx="9" ry="5" fill="#f43f5e" opacity="0.35"/>

    <!-- Eyebrows -->
    <path d="M72,69 Q82,65 92,69" fill="none" stroke="#db2777" stroke-width="3" stroke-linecap="round"/>
    <path d="M108,69 Q118,65 128,69" fill="none" stroke="#db2777" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes (Left & Right) -->
    <!-- Left Eye -->
    <ellipse cx="82" cy="78" rx="7" ry="6.5" fill="#ffffff"/>
    <circle cx="82.5" cy="78" r="4.5" fill="#0284c7"/>
    <circle cx="82.5" cy="78" r="2.2" fill="#111827"/>
    <circle cx="80.5" cy="76" r="1.5" fill="#ffffff"/>
    <path d="M74,75 Q82,71 90,75" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Eye -->
    <ellipse cx="118" cy="78" rx="7" ry="6.5" fill="#ffffff"/>
    <circle cx="117.5" cy="78" r="4.5" fill="#0284c7"/>
    <circle cx="117.5" cy="78" r="2.2" fill="#111827"/>
    <circle cx="115.5" cy="76" r="1.5" fill="#ffffff"/>
    <path d="M110,75 Q118,71 126,75" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M98,84 Q100,94 95,95 Q100,96 105,95" fill="none" stroke="#fca5a5" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Mouth / Smile -->
    <path d="M89,106 Q100,116 111,106" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <path d="M93,107 Q100,113 107,107" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Front Hair -->
  <g class="hair">
    <path d="M56,72 C56,36 144,36 144,72 C144,78 136,60 120,52 C100,44 80,48 68,58 C60,68 56,78 56,72 Z" fill="url(#hairGrad6)"/>
                    <path d="M60,68 C54,95 56,135 68,152 C62,125 64,95 68,76 Z" fill="url(#hairGrad6)"/>
                    <path d="M140,68 C146,95 144,135 132,152 C138,125 136,95 132,76 Z" fill="url(#hairGrad6)"/>
                    <path d="M70,54 Q100,46 130,54" fill="none" stroke="#fdf2f8" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Accessories & Highlights -->
  <circle cx="58" cy="94" r="3" fill="#06b6d4"/>
                      <circle cx="142" cy="94" r="3" fill="#06b6d4"/>
  

  <!-- Outer Glass Border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
</svg>