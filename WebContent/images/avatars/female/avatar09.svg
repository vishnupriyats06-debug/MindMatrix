<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad9" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
    <!-- Skin Shading -->
    <linearGradient id="skinGrad9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <!-- Hair Gradient -->
    <linearGradient id="hairGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <!-- Filter Glow -->
    <filter id="softGlow9" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Clip / Base -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad9)"/>
  <!-- Ambient Orbit Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Back Hair (if any) -->
  <circle cx="62" cy="65" r="14" fill="#431407"/>
                         <circle cx="138" cy="65" r="14" fill="#431407"/>
                         <circle cx="100" cy="44" r="16" fill="#431407"/>

  <!-- Body / Torso / Neck -->
  <!-- Neck -->
  <path d="M86,120 L114,120 L118,150 L82,150 Z" fill="#f97316" opacity="0.95"/>
  <path d="M88,126 C96,134 104,134 112,126 L112,136 C104,142 96,142 88,136 Z" fill="rgba(0,0,0,0.12)"/>

  <!-- Clothing / Shoulders -->
  <g class="clothing">
    <path d="M46,146 C50,124 80,122 100,122 C120,122 150,124 154,146 L170,200 L30,200 Z" fill="#f59e0b"/>
                        <path d="M78,122 C78,144 122,144 122,122 Z" fill="#d97706"/>
                        <line x1="60" y1="160" x2="140" y2="160" stroke="#b45309" stroke-width="2"/>
  </g>

  <!-- Head / Face Base -->
  <g class="face">
    <!-- Head Base Shape -->
    <path d="M62,80 C62,48 138,48 138,80 C138,114 122,136 100,136 C78,136 62,114 62,80 Z" fill="url(#skinGrad9)"/>
    
    <!-- Ears -->
    <ellipse cx="61" cy="88" rx="6.5" ry="10" fill="#fed7aa"/>
    <ellipse cx="61" cy="88" rx="3.5" ry="6" fill="#f97316"/>
    <ellipse cx="139" cy="88" rx="6.5" ry="10" fill="#fed7aa"/>
    <ellipse cx="139" cy="88" rx="3.5" ry="6" fill="#f97316"/>

    <!-- Cheeks Blush -->
    <ellipse cx="76" cy="98" rx="9" ry="5" fill="#f43f5e" opacity="0.35"/>
    <ellipse cx="124" cy="98" rx="9" ry="5" fill="#f43f5e" opacity="0.35"/>

    <!-- Eyebrows -->
    <path d="M72,69 Q82,65 92,69" fill="none" stroke="#431407" stroke-width="3" stroke-linecap="round"/>
    <path d="M108,69 Q118,65 128,69" fill="none" stroke="#431407" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes (Left & Right) -->
    <!-- Left Eye -->
    <ellipse cx="82" cy="78" rx="7" ry="6.5" fill="#ffffff"/>
    <circle cx="82.5" cy="78" r="4.5" fill="#059669"/>
    <circle cx="82.5" cy="78" r="2.2" fill="#111827"/>
    <circle cx="80.5" cy="76" r="1.5" fill="#ffffff"/>
    <path d="M74,75 Q82,71 90,75" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Eye -->
    <ellipse cx="118" cy="78" rx="7" ry="6.5" fill="#ffffff"/>
    <circle cx="117.5" cy="78" r="4.5" fill="#059669"/>
    <circle cx="117.5" cy="78" r="2.2" fill="#111827"/>
    <circle cx="115.5" cy="76" r="1.5" fill="#ffffff"/>
    <path d="M110,75 Q118,71 126,75" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M98,84 Q100,94 95,95 Q100,96 105,95" fill="none" stroke="#f97316" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Mouth / Smile -->
    <path d="M89,106 Q100,116 111,106" fill="none" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/>
    <path d="M93,107 Q100,113 107,107" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Front Hair -->
  <g class="hair">
    <circle cx="66" cy="68" r="12" fill="url(#hairGrad9)"/>
                    <circle cx="134" cy="68" r="12" fill="url(#hairGrad9)"/>
                    <circle cx="78" cy="54" r="12" fill="url(#hairGrad9)"/>
                    <circle cx="122" cy="54" r="12" fill="url(#hairGrad9)"/>
                    <circle cx="100" cy="48" r="14" fill="url(#hairGrad9)"/>
                    <path d="M68,60 C78,48 122,48 132,60" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Accessories & Highlights -->
  <circle cx="58" cy="92" r="3" fill="#fef08a"/>
                      <circle cx="142" cy="92" r="3" fill="#fef08a"/>
  

  <!-- Outer Glass Border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
</svg>